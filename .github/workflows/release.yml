name: Windows EXE
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-build.txt
      - run: python -m unittest discover -s tests -v
      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: python
        run: |
          import os
          from bill_splitter.version import VERSION
          assert os.environ['GITHUB_REF_NAME'] == 'v' + VERSION, 'Tag must match VERSION'
      - run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name BillSplitter app.py
      - name: Checksum
        shell: pwsh
        run: |
          $digest = (Get-FileHash -LiteralPath dist/BillSplitter.exe -Algorithm SHA256).Hash.ToLower()
          Set-Content -LiteralPath dist/BillSplitter.exe.sha256 -Value "$digest  BillSplitter.exe" -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: BillSplitter-Windows
          path: dist/BillSplitter.exe*
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$env:GITHUB_REF_NAME" dist/BillSplitter.exe dist/BillSplitter.exe.sha256 --verify-tag --generate-notes
