name: Windows EXE
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-build.txt
      - run: python -m unittest discover -s tests -v
      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: python
        run: |
          import os
          import sys
          sys.path.insert(0, os.environ["GITHUB_WORKSPACE"])
          from bill_splitter.version import VERSION
          assert os.environ['GITHUB_REF_NAME'] == 'v' + VERSION, 'Tag must match VERSION'
      - run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name wuli娟娟 app.py
      - name: Checksum
        shell: pwsh
        run: |
          $digest = (Get-FileHash -LiteralPath 'dist/wuli娟娟.exe' -Algorithm SHA256).Hash.ToLower()
          Set-Content -LiteralPath 'dist/wuli娟娟.exe.sha256' -Value "$digest  wuli娟娟.exe" -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: wuli娟娟-Windows
          path: dist/wuli娟娟.exe*
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$env:GITHUB_REF_NAME" 'dist/wuli娟娟.exe' 'dist/wuli娟娟.exe.sha256' --verify-tag --generate-notes
